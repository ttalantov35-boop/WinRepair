name: Release
# 1) Push a tag like v1.0.3  -> builds x64 + x86 + ARM64 and publishes a GitHub Release.
# 2) Actions -> Release -> Run workflow (enter the existing tag, e.g. v1.0.3)
#    -> rebuilds from the chosen branch, MOVES that tag to the new commit and
#    REPLACES the files in the existing release. The version number does not change.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  release:
    # windows-2022 = Visual Studio 2022 only (MSVC 14.4x). windows-latest/windows-2025 carry VS 2026 (MSVC 14.52),
    # whose x64 code contained AVX instructions and crashed with 0xC000001D on CPUs without AVX (e.g. Core 2).
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022
      - name: Show compiler version
        shell: cmd
        run: cl 2>&1 | findstr /i "Version"
      - name: Package x64
        shell: cmd
        run: make_package.bat x64
      - name: Check x64 exe has no AVX in program code
        # Safe check: only READS the exe, changes nothing. A release built with the broken MSVC 14.52 had ~26
        # AVX "zeroing" instructions in program code (crash 0xC000001D on CPUs without AVX, e.g. Core 2);
        # good builds have 7-8 (CRT code behind a CPU check). Fails the release if the count is above 15.
        shell: pwsh
        run: |
          $exe = "dist\WinRepair\WinRepair_x64.exe"
          $n = (& dumpbin /disasm:nobytes $exe | Select-String -Pattern '\bvpxor\s+(xmm\d+),\1,\1\b').Count
          Write-Host "AVX zeroing instructions found: $n (normal: 7-8, broken build: ~26, limit: 15)"
          if ($n -gt 15) {
            Write-Host "::error::x64 exe contains AVX instructions in program code - it will crash on old CPUs. Check the compiler version above."
            exit 1
          }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          vsversion: 2022
      - name: Package x86
        shell: cmd
        run: make_package.bat x86
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
          vsversion: 2022
      - name: Package ARM64 (cross)
        shell: cmd
        run: make_package.bat arm64
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\WinRepair -DestinationPath "WinRepair-$env:TAG.zip" -Force
          (Get-FileHash "WinRepair-$env:TAG.zip" -Algorithm SHA256).Hash | Out-File "WinRepair-$env:TAG.zip.sha256" -Encoding ascii
      - name: Standalone exe files (download and run, no unpacking)
        shell: pwsh
        run: |
          Copy-Item dist\WinRepair\WinRepair_x64.exe WinRepair_x64.exe
          Copy-Item dist\WinRepair\WinRepair_x86.exe WinRepair_x86.exe
          Copy-Item dist\WinRepair\WinRepair_arm64.exe WinRepair_arm64.exe
      - name: Move tag to this commit (manual run only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            WinRepair_x64.exe
            WinRepair_x86.exe
            WinRepair_arm64.exe
            WinRepair-${{ env.TAG }}.zip
            WinRepair-${{ env.TAG }}.zip.sha256
          generate_release_notes: true
